<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Abel Saferyan</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #fff;
        font-family: monospace;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        text-align: center;
        padding: 24px;
      }
      .code { font-size: 6rem; font-weight: 800; color: #3b82f6; letter-spacing: -.04em; line-height: 1; }
      .msg { color: #71717a; font-size: .875rem; letter-spacing: .1em; text-transform: uppercase; }
      .sub { color: #52525b; font-size: .75rem; margin-top: 4px; }
      a {
        margin-top: 8px;
        padding: 10px 24px;
        border: 1px solid rgba(59,130,246,0.4);
        border-radius: 999px;
        color: #93c5fd;
        font-size: .75rem;
        text-decoration: none;
        letter-spacing: .1em;
        transition: background .2s;
      }
      a:hover { background: rgba(59,130,246,0.1); }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <p class="msg">// Page_Not_Found</p>
    <p class="sub">Halaman yang kamu cari tidak ada atau sudah dipindahkan.</p>
    <a href="/">← Kembali ke Home</a>
  </body>
</html>
